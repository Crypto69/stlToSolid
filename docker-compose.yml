services:
  stltosolid:
    image: stltosolid:latest
    build:
      context: .
      args:
        # deploy.sh fills these in from git; a plain `docker compose build`
        # leaves them 'unknown'
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "8321:8000"
    volumes:
      - ./data:/data
    environment:
      # jobs older than this many seconds are deleted automatically
      STLTOSOLID_JOB_TTL: "86400"
      # conversions run one at a time; scan repair can peak at several GB
      STLTOSOLID_CONCURRENCY: "1"
      # Shells (bodies and their cavities) converted at once inside a job.
      # Two of the NAS's four cores, the rest for the kernel's threads and
      # the NAS's other services. Raise it on a bigger machine by setting
      # STLTOSOLID_WORKERS in the environment: measured 2026-09-04 on the
      # 72-shell controller, the body split costs ~2.8 GB once and each
      # extra worker only ~0.5 GB, so four workers converted 13 bodies in
      # 8.7 min at a 4.2 GB peak (12 GB limit). Four on the NAS would still
      # be a poor trade: it has four cores and shares them.
      STLTOSOLID_WORKERS: "${STLTOSOLID_WORKERS:-2}"
      # seconds a shell may take in a worker before it is built faceted
      # instead (default 900)
      # STLTOSOLID_SHELL_TIMEOUT: "900"
      # seconds one shell's extrusion-axis search may take before the best
      # candidate so far is used (default 120; 0 means no limit)
      # STLTOSOLID_AXIS_BUDGET: "120"
      # seconds an X-Ray script download may spend fitting its slices
      # before it gives up (default 240; under a browser's 300 s limit)
      # STLTOSOLID_XRAY_BUDGET: "240"
      # Blueprint (drawing -> solid). Users paste their own vision-model key
      # in the panel (kept in their browser, sent per request, never stored
      # here). A server-side key is an opt-in fallback for a private
      # install: on a shared LAN anyone who can reach the app could spend it.
      # STLTOSOLID_ANTHROPIC_API_KEY: "sk-ant-…"
      # STLTOSOLID_OPENAI_API_KEY: "sk-…"
      # STLTOSOLID_DEEPSEEK_API_KEY: "…"
      # seconds one read of a drawing may take (default 300; DeepSeek 1200)
      # STLTOSOLID_BLUEPRINT_TIMEOUT: "300"
      # largest drawing image accepted, bytes (default 20 MB)
      # STLTOSOLID_MAX_IMAGE: "20971520"
      # Blueprint's code mode: for a part the recipe language cannot draw,
      # the model writes a short CadQuery script that runs in a worker here
      # under an allow-list (only cadquery and math, no files, no while).
      # On by default; set 0 on a shared install that would rather not run
      # model-written code at all.
      # STLTOSOLID_ALLOW_CODE: "1"
      # seconds one run of that script may take before it is stopped (default 120)
      # STLTOSOLID_CODE_TIMEOUT: "120"
      # look-and-fix rounds the Blueprint panel starts with, 0..3 (default 0 =
      # off): each round builds the part, draws it from four sides and asks
      # the model to compare the pictures with the drawing — one more model
      # call, and it can talk itself into a wrong reading; try 1 or 2 per part
      # STLTOSOLID_BLUEPRINT_ROUNDS: "0"
    # keep a runaway conversion from starving the NAS's other services
    mem_limit: 12g
    restart: unless-stopped

  # The MCP server for AI clients on other machines. Off unless asked for:
  #   STLTOSOLID_MCP_TOKEN=... docker compose --profile mcp up -d
  # Clients connect to http://<this machine>:8322/mcp and send that token as a
  # bearer token. Files live in ./data/mcp: share that folder, or send files
  # with PUT /files/<name>. Results come back with download links.
  stltosolid-mcp:
    image: stltosolid:latest
    profiles: [mcp]
    command:
      - stltosolid-mcp
      - --http
      - --host=0.0.0.0
      - --port=8322
      - --root=/data/mcp
      - --base-url=${STLTOSOLID_MCP_URL:-http://localhost:8322}
    ports:
      - "8322:8322"
    volumes:
      - ./data:/data
    environment:
      # required: the server refuses a network port with no token
      STLTOSOLID_MCP_TOKEN: "${STLTOSOLID_MCP_TOKEN:-}"
      STLTOSOLID_WORKERS: "${STLTOSOLID_WORKERS:-2}"
      # 1 lets clients run model-written CadQuery under the allow-list
      STLTOSOLID_MCP_ALLOW_CODE: "${STLTOSOLID_MCP_ALLOW_CODE:-0}"
    mem_limit: 12g
    restart: unless-stopped
